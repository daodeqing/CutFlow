[package]
name = "cutflow-desktop"
version = "0.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "CutFlow"
path = "src/main.rs"

[lib]
name = "bdl_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
bdl-tauri = { path = "../../../crates/bdl-tauri" }
bdl-core = { path = "../../../crates/bdl-core" }
cutflow-workbench = { path = "../../../../../workbench" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2.3.1"

[target.'cfg(target_os = "android")'.dependencies]
bdl-mobile-credentials = { path = "../../../crates/bdl-mobile-credentials" }
bdl-mobile-execution = { path = "../../../crates/bdl-mobile-execution" }
bdl-mobile-media = { path = "../../../crates/bdl-mobile-media" }
bdl-mobile-storage = { path = "../../../crates/bdl-mobile-storage" }

[build-dependencies]
tauri-build = { version = "2", features = [] }
