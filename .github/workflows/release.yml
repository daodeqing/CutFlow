name: Publish verified CutFlow release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Windows build run containing the final package
        required: true
        default: '39008988766'
      tag:
        description: Release version matching the package
        required: true
        default: 'v0.6.5'
permissions:
  contents: write
  actions: read
concurrency:
  group: cutflow-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify source build
        id: source
        env:
          CUTFLOW_RELEASE_RUN: ${{ inputs.run_id }}
          CUTFLOW_RELEASE_TAG: ${{ inputs.tag }}
        run: python -B -X utf8 scripts/publish_release.py --prepare
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ steps.source.outputs.artifact_name }}
          path: .build/release-assets
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify checksums and publish installer and portable package
        env:
          CUTFLOW_RELEASE_RUN: ${{ inputs.run_id }}
          CUTFLOW_RELEASE_TAG: ${{ inputs.tag }}
        run: python -B -X utf8 scripts/publish_release.py --assets-dir .build/release-assets
